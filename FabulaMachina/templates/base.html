<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Framed Fountain Viewer{% endblock %}</title>
    <link rel="stylesheet" type="text/css" href="/static/style.css">
    <link rel="stylesheet" type="text/css" href="/static/fac.css">
    <link rel="stylesheet" type="text/css" href="/static/sidebar.css">
    <script src="/static/fac.js"></script>
    <script src="/static/audio.js"></script>
    <script src="/static/auto_updater.js"></script>
    <script src="/static/sidebar.js"></script>
    {% block head %}{% endblock %}
</head>
<body>
    <div id="app-container">
        <div id="sidebar" class="sidebar">
            <div class="sidebar-resize-handle"></div>
            <div class="sidebar-header">
                <div class="sidebar-tabs">
                    <button class="tab-btn active" data-tab="history">History</button>
                    <button class="tab-btn" data-tab="console">Console</button>
                </div>
                <button id="sidebar-toggle" class="sidebar-toggle" title="Toggle Sidebar">◀</button>
            </div>

            <div id="history-tab" class="tab-content active">
                <div class="history-container">
                    <div id="history-list" class="history-list"></div>
                </div>
            </div>

            <div id="console-tab" class="tab-content">
                <div class="console-container">
                    <div id="console-output" class="console-output"></div>
                    <div class="console-footer">
                        <button id="clear-console" class="clear-btn">Clear</button>
                    </div>
                </div>
            </div>
        </div>

        <div id="main-content" class="main-content">
            <div class="nav">
                <a href="/">← Back to Books</a>
            </div>

            {% block content %}{% endblock %}
        </div>
    </div>
</body>
</html>
