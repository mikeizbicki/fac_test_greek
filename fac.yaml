
"common/about.md":
  description:
    Describes the main ideas of this series of books.
    The description should address
    1. the target audience,
    2. unique features about these books, and
    3. common characters and themes.
    The lenth should be about 1 page.

"common/art.md":
  description:
    Detailed intructions for how to style the artwork written for an artist.
    Different artists should be able to follow these instructions and get similar results.
    Note that these instructions only focus on style,
    and later instructions will focus on content.
    The lenth should be about 1 paragraph.

"common/writing.md":
  description:
    Detailed instructions for writing and formatting text.
    Different writers should be able to follow these instructions and get similar results.
    Note that these instructions only focus on style,
    and later instructions will focus on content.
    The lenth should be about 1 paragraph.

################################################################################
# characters/
################################################################################

"characters/$CHARACTER/about.json":
  description:
    A description of the character that can be used to ensure consistency accross many different books.
  schema_file: schemas/character.json-schema
  dependencies:
    - common/about.md
  variables:
    CHARACTER:
      ls characters

"characters/$CHARACTER/artist_instructions.md":
  description:
    A short 3-5 sentence description of how the character should always be drawn.
    Include information about the physical appearance only of elements that are ALWAYS with the character.
    (For example, body parts like hair/eye color are always appropriate; clothing and accessories like glasses may or may not be appropriate depending on the character; commonly used items like a sword or book are never appropriate. You should not list the character's key objects here.)
    Be specific about which colors should be used for which parts of the character.
    Do not include stylistic information (e.g. cartoonish, realistic, anime) as that will be provided in a different document.
  dependencies:
    - common/about.md
    - characters/$CHARACTER/about.json

"characters/$CHARACTER/character_sheet.png":
  description:
    This is a character sheet for the character $CHARACTER.
    The background is transparent and only the character is drawn.
    Draw the character four times.
    1. Each drawing should have a different pose/action.
    2. Each drawing should have a different camera angle (front, profile, back, angle).
    3. All drawings should respect the instructions in the "art.md" and "characters/$CHARACTER/artist_instructions.md" files.
  options:
    model: fal-ai/nano-banana-pro
  dependencies:
    - common/about.md
    - common/art.md
    - characters/$CHARACTER/about.json
    - characters/$CHARACTER/artist_instructions.md

################################################################################
# locations/
################################################################################

"locations/$LOCATION/about.json":
  description:
    A description of a location.
    All of the scenes of the various stories will take place at one of these locations.
  schema_file: schemas/location.json-schema
  dependencies:
    - common/about.md
    - locations/$ANCESTOR_LOCATIONS/about.json
  variables:
    LOCATION:
      ls locations

    # NOTE:
    # Locations are defined in a way where underscores determine a hierarchical relationship.
    # For example:
    # - "house_exterior" would be a parent of "house_exterior_frontyard".
    # - "house_exterior" would be a child of house.
    # When defining a new descendent location, we want it to be aware of all of its ancestors to ensure consistency between them.
    # This variable extracts all of the ancestors.
    # For example:
    # - if LOCATION is "house_exterior", ANCESTOR_LOCATIONS will be "house"
    # - if LOCATION is "house_exterior_frontyard", ANCESTOR_LOCATIONS will be "house" and "house_exterior"
    # There is also a check to ensure that these locations already exist.
    # If the ancestor locations do not already exist, they will not be built automatically.
    ANCESTOR_LOCATIONS: |
      echo "$LOCATION" | tr '_' '\n' | awk '{line = (NR == 1) ? $1 : line "_" $1; print line}' | head -n -1 | while read path; do
        if [[ -d "locations/$path" ]]; then
          echo "$path"
        fi
      done

"locations/$LOCATION/reference.png":
  description:
    A reference image for the location described in the file "locations/$LOCATION/about.json".
    The image should have no characters, and display the location empty.
  options:
    model: fal-ai/nano-banana
  dependencies:
    - common/art.md
    - locations/$LOCATION/about.json
    - locations/$ANCESTOR_LOCATIONS/reference.png
  variables:
    # FIXME:
    # We should redefine the build-system to inherit this variable from the about.json
    ANCESTOR_LOCATIONS: |
      echo "$LOCATION" | tr '_' '\n' | awk '{line = (NR == 1) ? $1 : line "_" $1; print line}' | head -n -1 | while read path; do
        if [[ -d "locations/$path" ]]; then
          echo "$path"
        fi
      done


################################################################################
# books/
################################################################################

"books/$LEVEL/themes.md":
  description:
    A short description of common themes for this level of book.
  variables:
    LEVEL:
      ls books

"books/$LEVEL/$BOOK/content.json":
  description:
    The story should be simple but have a clear beginning, middle, and end.
  schema_file: schemas/content.json-schema
  dependencies:
    common/about.md
    common/writing.md
    books/$LEVEL/themes.md
    characters/$CHARACTER/about.json
    locations/$LOCATION/about.json
  variables:
    BOOK:
      # this command is like `ls books/$LEVEL` but it will only output directories;
      # this means that it will not find the `themes.md` file in `books/$LEVEL`;
      # the simpler ls command results in errors from treating that file like a directory
      find books/$LEVEL -maxdepth 1 -type d -not -path books/$LEVEL -printf "%f\n"

########################################
# artwork
########################################

"books/$LEVEL/$BOOK/frames/$FRAME_ID/art.png":
  description:
    You are drawing the keyframe for an animation that will help young children learning Koine Greek how to understand the text in the content below.
    <content>
    $(jq -c ".frames[] | select(.frame_id == \"$FRAME_ID\") | {text, objects, locations, artist_notes, positioning}" books/$LEVEL/$BOOK/content.json)
    </content>
    The art should never include written text in any language.
    The result should be full-bleed with no margin/padding/border/whitespace.
  options:
    model: fal-ai/nano-banana/edit
    aspect_ratio: '16:9'
  dependencies:
    - common/art.md
    - target: books/$LEVEL/$BOOK/content.json
      include: false
    - books/$LEVEL/$BOOK/frames/$REFERENCE_FRAME/art.png
    - locations/$MAYBE_LOCATION/about.json
    - locations/$MAYBE_LOCATION/reference.png
    - characters/$CHARACTER/about.json
    - characters/$CHARACTER/character_sheet.png
  variables:
    FRAME_ID:
      jq -r ".frames[].frame_id" books/$LEVEL/$BOOK/content.json
    CHARACTER:
      jq -r ".frames[] | select(.frame_id == \"$FRAME_ID\") | .characters[]" books/$LEVEL/$BOOK/content.json
    REFERENCE_FRAME:
      jq -r ".frames[] | select(.frame_id == \"$FRAME_ID\") | .reference_frame // empty" books/$LEVEL/$BOOK/content.json

    # NOTE:
    # This variable is different than the LOCATION variable because it will not be included if the REFERENC_FRAME variable is defined in the JSON.
    MAYBE_LOCATION: |
      if [ -z $REFERENCE_FRAME ]; then
        jq -r ".frames[] | select(.frame_id == \"$FRAME_ID\") | .locations[]" books/$LEVEL/$BOOK/content.json
      fi

########################################
# print book
########################################

"books/$LEVEL/$BOOK/frames/$FRAME_ID/page.pdf":
  cmd: |
    cp templates/page_template.tex books/$LEVEL/$BOOK/frames/$FRAME_ID/page.tex
    cd books/$LEVEL/$BOOK/frames/$FRAME_ID
    jq -r ".frames[] | select(.frame_id == \"$FRAME_ID\") | .text" ../../content.json > content.txt
    lualatex page.tex && lualatex page.tex
  dependencies:
    - templates/page_template.tex
    - books/$LEVEL/$BOOK/frames/$FRAME_ID/art.png

"books/$LEVEL/$BOOK/pages.pdf":
  cmd: |
    ordered_FRAME_IDs=$(jq -r .frames[].frame_id books/$LEVEL/$BOOK/content.json)
    pdfunite $(printf "books/$LEVEL/$BOOK/frames/%s/page.pdf " $ordered_FRAME_IDs) books/$LEVEL/$BOOK/pages.pdf
  dependencies:
    - books/$LEVEL/$BOOK/frames/$FRAME_ID/page.pdf
    - books/$LEVEL/$BOOK/content.json

####################
## redo the book with debugging info added
####################

"books/$LEVEL/$BOOK/frames/$FRAME_ID/page_debug.pdf":
  cmd: |
    cd books/$LEVEL/$BOOK/frames/$FRAME_ID
    convert page.pdf \( -background white -fill black -pointsize 20 -size x30 label:"$FRAME_ID" \) -gravity northeast -geometry +10+10 -composite page_debug.pdf
  dependencies:
    - books/$LEVEL/$BOOK/frames/$FRAME_ID/page.pdf

"books/$LEVEL/$BOOK/pages_debug.pdf":
  cmd: |
    ordered_FRAME_IDs=$(jq -r .frames[].frame_id books/$LEVEL/$BOOK/content.json)
    pdfunite $(printf "books/$LEVEL/$BOOK/frames/%s/page_debug.pdf " $ordered_FRAME_IDs) books/$LEVEL/$BOOK/pages_debug.pdf
  dependencies:
    - books/$LEVEL/$BOOK/frames/$FRAME_ID/page_debug.pdf
    - books/$LEVEL/$BOOK/content.json

################################################################################
# video
################################################################################

"books/$LEVEL/$BOOK/frames/$FRAME_ID/page.wav":
  dependencies:
    - books/$LEVEL/$BOOK/content.jsonl
  options:
    voice: fable
    input: 
      $(jq -r "select(.frame_id == \"$FRAME_ID\") | .text" books/$LEVEL/$BOOK/content.jsonl)
    instructions:
      You are narrating a Koine Greek children's book.  FRAME_ID=$FRAME_ID.  Speak in a cheerful and positive tone.
  variables:
    FRAME_ID:
      jq -r .frame_id books/$LEVEL/$BOOK/content.jsonl

"books/$LEVEL/$BOOK/frames/$FRAME_ID/art_1280x720.png":
  cmd: |
    convert \
      "books/$LEVEL/$BOOK/frames/$FRAME_ID/art.png" \
      -background lightgray -flatten -resize 1280x720! \
      "books/$LEVEL/$BOOK/frames/$FRAME_ID/art_1280x720.png"
  dependencies:
    - books/$LEVEL/$BOOK/frames/$FRAME_ID/art.png

"books/$LEVEL/$BOOK/frames/$FRAME_ID/art_1920x1080.png":
  cmd: |
    convert \
      "books/$LEVEL/$BOOK/frames/$FRAME_ID/art.png" \
      -background lightgray -flatten -resize 1920x1080! \
      "books/$LEVEL/$BOOK/frames/$FRAME_ID/art_1920x1080.png"
  dependencies:
    - books/$LEVEL/$BOOK/frames/$FRAME_ID/art.png

"books/$LEVEL/$BOOK/frames/$FRAME_ID/video_instructions.txt":
  description:
    You are animating a short 4 second scene in a childrens movie.
    The animation should help young children learning Koine Greek how to understand the text in the content below.
    <content>
    $(jq -r "select(.frame_id == \"$FRAME_ID\")" books/$LEVEL/$BOOK/content.jsonl)
    </content>
    The start/stop frames of the scene have already been drawn and is provided in the attached images.
    You must provide a 1-4 sentence description of how to animate the provided input image.
    Use simple language that is easy to follow, and always describe the events in chronological order.
    The description should explicitly describe what each character is doing (e.g. running, sitting, writing) and their emotions (e.g. angry, happy, sad).
    All descriptions must perfectly match the images.
    You should not describe the end position of the characters.
    #, and their final position in the shot (e.g. stage-left, stage-right, off-camera).
  dependencies:
    - books/$LEVEL/$BOOK/frames/$FRAME_ID/art_1280x720.png
    - books/$LEVEL/$BOOK/frames/$REFERENCE_FRAME/last_frame.png
    - characters/$CHARACTER/about.json
  variables:
    REFERENCE_FRAME:
      jq -r "select(.frame_id == \"$FRAME_ID\") | .reference_frame // empty" books/$LEVEL/$BOOK/content.jsonl
    CHARACTER:
      jq -r "select(.frame_id == \"$FRAME_ID\") | .characters[]" books/$LEVEL/$BOOK/content.jsonl

"books/$LEVEL/$BOOK/frames/$FRAME_ID/video.mp4":
  dependencies:
    - books/$LEVEL/$BOOK/frames/$FRAME_ID/art_1280x720.png
      #- books/$LEVEL/$BOOK/frames/$FRAME_ID/art_1920x1080.png
    - target: books/$LEVEL/$BOOK/frames/$FRAME_ID/video_instructions.txt
      is_prompt: true
      #- books/$LEVEL/$BOOK/frames/$REFERENCE_FRAME/art_1280x720.png
    - books/$LEVEL/$BOOK/frames/$REFERENCE_FRAME/last_frame.png
      #- books/$LEVEL/$BOOK/frames/$REFERENCE_FRAME/last_frame_1920x1080.png
      #- characters/$CHARACTER/character_sheet.png
  options: |
    $(
    if [ -z "$REFERENCE_FRAME" ]; then
    #if true; then
    #echo "
    #model: openai/sora-2
    #size: 1280x720
    #seconds: 4
    #"
    echo "
    model: fal-ai/kling-video/v2.5-turbo/standard/image-to-video
    first_frame: books/$LEVEL/$BOOK/frames/$FRAME_ID/art_1280x720.png
    duration: 5
    "
    else
    #echo "
    #model: fal-ai/kling-video/o1/reference-to-video
    #seconds: 5
    #start_frame: books/$LEVEL/$BOOK/frames/$REFERENCE_FRAME/last_frame_1920x1080.png
    #"
    #model: fal-ai/veo3.1/fast/first-last-frame-to-video
    echo "
    model: fal-ai/kling-video/o1/image-to-video
    first_frame: books/$LEVEL/$BOOK/frames/$REFERENCE_FRAME/last_frame.png
    last_frame: books/$LEVEL/$BOOK/frames/$FRAME_ID/art_1280x720.png
    "
    fi
    )
  variables:
    REFERENCE_FRAME:
      jq -r "select(.frame_id == \"$FRAME_ID\") | .reference_frame // empty" books/$LEVEL/$BOOK/content.jsonl
    CHARACTER:
      jq -r "select(.frame_id == \"$FRAME_ID\") | .characters[]" books/$LEVEL/$BOOK/content.jsonl

"books/$LEVEL/$BOOK/frames/$FRAME_ID/processed.mp4":
  cmd: |
    cd books/$LEVEL/$BOOK/frames/$FRAME_ID

    # Get durations
    VIDEO_DURATION=$(ffprobe -v quiet -show_entries format=duration -of csv=p=0 video.mp4)
    AUDIO_DURATION=$(ffprobe -v quiet -show_entries format=duration -of csv=p=0 page.wav)

    # Calculate target video duration with padding (specified in seconds)
    START_PAD=0.2
    END_PAD=1
    TARGET_DURATION=$(echo "scale=6; $AUDIO_DURATION + $START_PAD + $END_PAD" | bc -l)

    # Compare target duration with original video duration
    if (( $(echo "$TARGET_DURATION > $VIDEO_DURATION" | bc -l) )); then
        # Need to slow down video to match target duration
        SLOWDOWN_FACTOR=$(echo "scale=6; $VIDEO_DURATION / $TARGET_DURATION" | bc -l)
        ffmpeg -i video.mp4 -i page.wav -filter:v "setpts=PTS/$SLOWDOWN_FACTOR" -c:a aac -af "adelay=${START_PAD}s,apad=pad_dur=${END_PAD}" -map 0:v:0 -map 1:a:0 -t $TARGET_DURATION processed-tmp.mp4 -y
    else
        # Video is long enough - pad audio and trim/pad video as needed
        ffmpeg -i video.mp4 -i page.wav -c:v copy -c:a aac -af "adelay=$START_PAD"s,apad -map 0:v:0 -map 1:a:0 -t $TARGET_DURATION processed-tmp.mp4 -y
    fi

    # We do a final re-encoding step to ensure that all of the files have the exact same parameters;
    # In theory, this shouldn't be necessary.
    # But I spent a lot of time trying to avoid this 2nd conversion fiddling with the commands above,
    # but there were always weird edge cases and bugs I couldn't resolve.
    ffmpeg -i processed-tmp.mp4 -r 30 -c:v libx264 -pix_fmt yuv420p -c:a aac -ar 48000 -ac 2 -vsync cfr -async 1 processed.mp4 -y
    rm processed-tmp.mp4
  dependencies:
    - books/$LEVEL/$BOOK/frames/$FRAME_ID/video.mp4
    - books/$LEVEL/$BOOK/frames/$FRAME_ID/page.wav

"books/$LEVEL/$BOOK/frames/$FRAME_ID/last_frame.png":
  cmd: |
    cd books/$LEVEL/$BOOK/frames/$FRAME_ID/
    #ffmpeg -i processed.mp4 -vf "select=eq(n\,$(ffprobe -v error -select_streams v:0 -count_frames -show_entries stream=nb_frames -of csv=p=0 processed.mp4)-1)" -vframes 1 -vsync 0 last_frame.png
    #ffmpeg -sseof -3 -i processed.mp4 -vframes 1 -y last_frame.png
    ffmpeg -sseof -1 -i processed.mp4 -f image2 temp_frame_%03d.png
    # The highest numbered file will be closest to the last frame
    LAST_FRAME=$(ls temp_frame_*.png | sort -V | tail -n 1)
    cp "$LAST_FRAME" last_frame.png
    rm temp_frame_*.png  # clean up others
  dependencies:
    - books/$LEVEL/$BOOK/frames/$FRAME_ID/processed.mp4

"books/$LEVEL/$BOOK/frames/$FRAME_ID/last_frame_1920x1080.png":
  cmd: |
    convert \
      "books/$LEVEL/$BOOK/frames/$FRAME_ID/last_frame.png" \
      -background lightgray -flatten -resize 1920x1080! \
      "books/$LEVEL/$BOOK/frames/$FRAME_ID/last_frame_1920x1080.png"
  dependencies:
    - books/$LEVEL/$BOOK/frames/$FRAME_ID/last_frame.png

"books/$LEVEL/$BOOK/video.mp4":
  cmd: |
    cd books/$LEVEL/$BOOK
    printf "file 'frames/%s/processed.mp4'\n" $FRAME_ID > video_list.txt

    # the following command concats the processed.mp4 files without re-encoding;
    # this is very fast but requires all of the processed.mp4 files to have same encoding parameters
    # the code for processed.mp4 should be written in a way to guarantee this
    ffmpeg -f concat -safe 0 -i video_list.txt -c copy "video.mp4" -y

    # the following command re-encodes all of the video;
    # it is much slower, but could be useful for debugging if the processed.mp4 files cannot be directly copied
    #ffmpeg -f concat -safe 0 -i video_list.txt -c:v libx264 -c:a aac "video.mp4" -y
  dependencies:
    - books/$LEVEL/$BOOK/frames/$FRAME_ID/processed.mp4
  variables:
    FRAME_ID:
      jq -r .frame_id books/$LEVEL/$BOOK/content.jsonl

"videos/$LEVEL-$BOOK.mp4":
  cmd: ln -s "../books/$LEVEL/$BOOK/video.mp4" "videos/$LEVEL-$BOOK.mp4"
  dependencies:
    - books/$LEVEL/$BOOK/video.mp4
