####################
# video post-processing
####################

"books/$LEVEL/$BOOK/frames/$FRAME_ID/processed.mp4":
  cmd: |
    cd books/$LEVEL/$BOOK/frames/$FRAME_ID

    # Get durations
    VIDEO_DURATION=$(ffprobe -v quiet -show_entries format=duration -of csv=p=0 video.mp4)
    AUDIO_DURATION=$(ffprobe -v quiet -show_entries format=duration -of csv=p=0 page.wav)

    # Calculate target video duration with padding (specified in seconds)
    START_PAD=0.2
    END_PAD=1
    TARGET_DURATION=$(echo "scale=6; $AUDIO_DURATION + $START_PAD + $END_PAD" | bc -l)

    # Compare target duration with original video duration
    if (( $(echo "$TARGET_DURATION > $VIDEO_DURATION" | bc -l) )); then
        # Need to slow down video to match target duration
        SLOWDOWN_FACTOR=$(echo "scale=6; $VIDEO_DURATION / $TARGET_DURATION" | bc -l)
        ffmpeg -i video.mp4 -i page.wav -filter:v "setpts=PTS/$SLOWDOWN_FACTOR" -c:a aac -af "adelay=${START_PAD}s,apad=pad_dur=${END_PAD}" -map 0:v:0 -map 1:a:0 -t $TARGET_DURATION processed-tmp.mp4 -y
    else
        # Video is long enough - pad audio and trim/pad video as needed
        ffmpeg -i video.mp4 -i page.wav -c:v copy -c:a aac -af "adelay=$START_PAD"s,apad -map 0:v:0 -map 1:a:0 -t $TARGET_DURATION processed-tmp.mp4 -y
    fi

    # Process additional audio files to match page.wav duration
    for audio_file in audio_*.wav; do
        echo ">> $audio_file"
        # Skip if it's a processed file
        if [[ "$audio_file" == *"_processed.wav" ]]; then
            continue
        fi
        if [ -f "$audio_file" ]; then
            LANG=$(echo "$audio_file" | sed 's/audio_\(.*\)\.wav/\1/')
            CURR_DURATION=$(ffprobe -v quiet -show_entries format=duration -of csv=p=0 "$audio_file")

            if (( $(echo "$CURR_DURATION > $AUDIO_DURATION" | bc -l) )); then
                # Speed up audio to match target duration
                SPEED_FACTOR=$(echo "scale=6; $CURR_DURATION / $AUDIO_DURATION" | bc -l)
                ffmpeg -i "$audio_file" -af "atempo=$SPEED_FACTOR" "audio_${LANG}_processed.wav" -y
            else
                # Audio is shorter or equal, just copy and pad
                ffmpeg -i "$audio_file" -af "apad=pad_dur=$AUDIO_DURATION" "audio_${LANG}_processed.wav" -y
            fi
        fi
    done

    # Convert text files to SRT format before processing
    for txt_file in translation_*.txt; do
        if [ -f "$txt_file" ]; then
            LANG=$(echo "$txt_file" | sed 's/translation_\(.*\)\.txt/\1/')
            srt_file="translation_${LANG}.srt"

            # Convert text to SRT format - assumes the entire text should be shown for the full duration
            echo "1" > "$srt_file"
            echo "00:00:00,200 --> 00:00:$(printf "%02d" $(echo "$AUDIO_DURATION" | cut -d. -f1)),$(echo "scale=0; ($AUDIO_DURATION - $(echo "$AUDIO_DURATION" | cut -d. -f1)) * 1000" | bc | cut -d. -f1)" >> "$srt_file"
            cat "$txt_file" >> "$srt_file"
            echo "" >> "$srt_file"
        fi
    done

    # Execute final conversion
    FFMPEG_CMD="ffmpeg -i processed-tmp.mp4"
    MAP_OPTS="-map 0:v:0 -map 0:a:0"
    METADATA=""
    input_index=1
    audio_track_index=1
    subtitle_track_index=0

    for audio_file in audio_*_processed.wav; do
        if [ -f "$audio_file" ]; then
            LANG=$(echo "$audio_file" | sed 's/audio_\(.*\)_processed\.wav/\1/')
            FFMPEG_CMD="$FFMPEG_CMD -i $audio_file"
            MAP_OPTS="$MAP_OPTS -map $input_index:a:0"
            METADATA="$METADATA -metadata:s:a:$audio_track_index language=$LANG -metadata:s:a:$audio_track_index title=$LANG"

            input_index=$((input_index + 1))
            audio_track_index=$((audio_track_index + 1))

            # Add subtitle if it exists
            if [ -f "translation_${LANG}.srt" ]; then
                FFMPEG_CMD="$FFMPEG_CMD -i translation_${LANG}.srt"
                MAP_OPTS="$MAP_OPTS -map $input_index:s:0"
                METADATA="$METADATA -metadata:s:s:$subtitle_track_index language=$LANG -metadata:s:s:$subtitle_track_index title=$LANG"
                input_index=$((input_index + 1))
                subtitle_track_index=$((subtitle_track_index + 1))
            fi
        fi
    done

    $FFMPEG_CMD $MAP_OPTS -r 30 -s 1280x720 -c:v libx264 -pix_fmt yuv420p -c:a aac -c:s mov_text -ar 48000 -ac 2 -vsync cfr $METADATA processed.mp4 -y

    # We do a final re-encoding step to ensure that all of the files have the exact same parameters;
    # In theory, this shouldn't be necessary.
    # But I spent a lot of time trying to avoid this 2nd conversion fiddling with the commands above,
    # but there were always weird edge cases and bugs I couldn't resolve.
    #ffmpeg -i processed-tmp.mp4 -r 30 -s 1280x720 -c:v libx264 -pix_fmt yuv420p -c:a aac -ar 48000 -ac 2 -vsync cfr -async 1 processed.mp4 -y
    #rm processed-tmp.mp4 audio_*_processed.wav
  dependencies:
    - books/$LEVEL/$BOOK/frames/$FRAME_ID/video.mp4
    - books/$LEVEL/$BOOK/frames/$FRAME_ID/page.wav

"books/$LEVEL/$BOOK/video.mp4":
  cmd: |
    cd books/$LEVEL/$BOOK
    printf "file 'frames/%s/processed.mp4'\n" $FRAME_ID > video_list.txt

    # the following command concats the processed.mp4 files without re-encoding;
    # this is very fast but requires all of the processed.mp4 files to have same encoding parameters
    # the code for processed.mp4 should be written in a way to guarantee this
    ffmpeg -f concat -safe 0 -i video_list.txt -c copy "video.mp4" -y

    # the following command re-encodes all of the video;
    # it is much slower, but could be useful for debugging if the processed.mp4 files cannot be directly copied
    #ffmpeg -f concat -safe 0 -i video_list.txt -c:v libx264 -c:a aac "video.mp4" -y
  dependencies:
    - books/$LEVEL/$BOOK/frames/$FRAME_ID/processed.mp4
  variables:
    FRAME_ID:
      jq -r ".frames[] | .frame_id" books/$LEVEL/$BOOK/content.json

"videos/$LEVEL-$BOOK.mp4":
  cmd: ln -s "../books/$LEVEL/$BOOK/video.mp4" "videos/$LEVEL-$BOOK.mp4"
  dependencies:
    - books/$LEVEL/$BOOK/video.mp4
