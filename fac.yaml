
"common/about.md":
  description:
    Describes the main ideas of this series of books.
    The description should address
    1. the target audience,
    2. unique features about these books, and
    3. common characters and themes.
    The lenth should be about 1 page.

"common/art.md":
  description:
    Detailed intructions for how to style the artwork written for an artist.
    Different artists should be able to follow these instructions and get similar results.
    Note that these instructions only focus on style,
    and later instructions will focus on content.
    The lenth should be about 1 paragraph.

"common/writing.md":
  description:
    Detailed instructions for writing and formatting text.
    Different writers should be able to follow these instructions and get similar results.
    Note that these instructions only focus on style,
    and later instructions will focus on content.
    The lenth should be about 1 paragraph.

################################################################################
# characters/
################################################################################

"characters/$CHARACTER/about.json":
  description:
    A description of the character that can be used to ensure consistency accross many different books.
  schema_file: schemas/character.json-schema
  dependencies:
    - common/about.md
  variables:
    CHARACTER:
      ls characters

"characters/$CHARACTER/voice.json":
  description:
    A description of the character's voice for a voice actor.
  schema_file: schemas/voice.json-schema
  dependencies:
    - common/about.md
    - characters/$CHARACTER/about.json

"characters/$CHARACTER/character_sheet.png":
  description:
    This is a character sheet for the character $CHARACTER.
    The background is transparent and only the character is drawn.
    Draw the character four times.
    1. Each drawing should have a different pose/action.
    2. Each drawing should have a different camera angle (front, profile, back, angle).
    3. All drawings should respect the instructions in the "art.md" and "characters/$CHARACTER/artist_instructions.md" files.
  options:
    model: fal-ai/nano-banana
  dependencies:
    #- common/about.md
    - common/art.md
    - characters/$CHARACTER/about.json

################################################################################
# locations/
################################################################################

"locations/$LOCATION/about.json":
  description:
    A description of a location.
    All of the scenes of the various stories will take place at one of these locations.
  schema_file: schemas/location.json-schema
  dependencies:
    - common/about.md
    - locations/$ANCESTOR_LOCATIONS/about.json
  variables:
    LOCATION:
      ls locations

    # NOTE:
    # Locations are defined in a way where underscores determine a hierarchical relationship.
    # For example:
    # - "house_exterior" would be a parent of "house_exterior_frontyard".
    # - "house_exterior" would be a child of house.
    # When defining a new descendent location, we want it to be aware of all of its ancestors to ensure consistency between them.
    # This variable extracts all of the ancestors.
    # For example:
    # - if LOCATION is "house_exterior", ANCESTOR_LOCATIONS will be "house"
    # - if LOCATION is "house_exterior_frontyard", ANCESTOR_LOCATIONS will be "house" and "house_exterior"
    # There is also a check to ensure that these locations already exist.
    # If the ancestor locations do not already exist, they will not be built automatically.
    ANCESTOR_LOCATIONS: |
      echo "$LOCATION" | tr '_' '\n' | awk '{line = (NR == 1) ? $1 : line "_" $1; print line}' | head -n -1 | while read path; do
        if [[ -d "locations/$path" ]]; then
          echo "$path"
        fi
      done

"locations/$LOCATION/reference.png":
  description:
    A reference image for the location described in the file "locations/$LOCATION/about.json".
    The image should have no characters, and display the location empty.
    The view should be from ground level.
    The result should be full-bleed with no margin/padding/border/whitespace.
  options:
    model: fal-ai/nano-banana
  dependencies:
    - common/art.md
    - locations/$LOCATION/about.json
    - locations/$ANCESTOR_LOCATIONS/reference.png
  variables:
    # FIXME:
    # We should redefine the build-system to inherit this variable from the about.json
    ANCESTOR_LOCATIONS: |
      echo "$LOCATION" | tr '_' '\n' | awk '{line = (NR == 1) ? $1 : line "_" $1; print line}' | head -n -1 | while read path; do
        if [[ -d "locations/$path" ]]; then
          echo "$path"
        fi
      done


################################################################################
# books/
################################################################################

"books/$LEVEL/themes.md":
  description:
    A short description of common themes for this level of book.
  variables:
    LEVEL:
      ls books

"books/$LEVEL/$BOOK/script.fountain":
  description:
    Generate a script file (in fountain format) for an animated short based on the file "books/$LEVEL/$BOOK/description.md".
    Use only characters that have a corresponding "characters/*/about.json" file. Do not describe the characters in detail, only reference the appropriate character.
    All scenes in the script must take place at one of the locations specified in the "locations/*/about.json" file. Do not describe the location in detail, only reference the appropriate scene.
    You can have "transitions" between scenes that involve both scenes (for example a follow shot from the outside of a house to the inside through the door; or a follow shot of a character walking from a house to the market), but you must explicitly state that the action is happening in a transition.
    You may mention objects that are needed for the story line, but do not be excessive in your details and only mention those objects that are strictly needed.
    You should explicitly annotate
    - when one scene ends and another begins,
    - any cuts/camera movements
    Levels A and B do not support dialogue, and so only the narrator will be talking.
    Only narration and dialogue should be in koine greek; all set directions/fountain commands should be in English.
    Include detailed camera directions (when to do close ups, when multiple characters should be in a shot, etc).
  dependencies:
    - common/about.md
    - common/writing.md
    - books/$INCLUDE_LEVEL/themes.md
    - books/$LEVEL/$BOOK/description.md
    - characters/$CHARACTER/about.json
    - locations/$LOCATION/about.json
  build_options:
    freeze: True
  variables:
    # INCLUDE_LEVEL will list all the levels that are less than or equal to $LEVEL
    # For example, if there are three levels:
    # levelA, levelB, and levelC
    # and LEVEL=levelB,
    # then INCLUDE_LEVEL will contain levelA and levelB but not levelC
    INCLUDE_LEVEL: |
      ls books | sort | awk -v target="$LEVEL" '$0 <= target'

"books/$LEVEL/$BOOK/script.fountain.framed":
  description:
    You are processing the input fountain script to divide it into rendering units called "frames".
    Each frame is between 2-10 seconds long and captures a single piece of action or dialogue.
    You're output should be the input script verbatim except with these frame annotations.

    A frame is annotated using a simplified version of XML.
    Each frame in the input script should be wrapped in a <frame></frame> tag.
    - Each frame tag must have a "frame_id" attribute whose value is the id of the frame.
      These ids should be a 1-5 word description of what happens in the frame in snake_case and without spaces (e.g. establish, harry_enters_hogwarts, or end_scene).
    - Each frame can optionally have a "reference_frame" attribute whose value is the "frame_id" of one of the previous frames.
      - The reference_frame should be provided whenever the current frame should be in a continuous shot (no camera cuts) with the previous frame.
      - It is common for a scene to be animated without any cuts, in which case all frames should have reference_frame set to the previous frame.
      - Another common pattern is to have short cuts that interrupt an otherwise continuous shot. (This often happens when there is action happening, then we cut to a closeup of a character to speak, or a closeup of some part of the action for just 1-2 frames.) In this case, the reference_frame after the cut should be the frame_id before the cut.

    Every piece of dialogue from a single character must have its own unique frame. The frame should also include any action descriptions, camera movement descriptions, or start of scene annotations that are happening at the same time as the dialogue (indicated in fountain notation by being immediately before the dialogue). A frame may never contain two characters speaking at the same time.

    Long sequences of action should be broken up into multiple frames.

    FADE IN and FADE OUT should be in frames by themselves.

    IT IS VERY IMPORTANT THAT YOU INCLUDE ALL OF THE ORIGINAL CONTENT OF THE FOUNTAIN SCRIPT IN THE OUTPUT. You are only adding <frame></frame> tags and not editing the content or removing the content. The frame tags should be added on lines by themselves for a clean diff that only shows the addition of frame tags and no removal of any lines.

  dependencies:
    - books/$LEVEL/$BOOK/script.fountain

"books/$LEVEL/$BOOK/script.html":
  cmd: |
    cd books/$LEVEL/$BOOK/
    sed 's/_/UNDERSCOREUNDERSCOREUNDERSCORE/g' script.fountain > script_escaped.fountain
    screenplain --format html script_escaped.fountain > script.html
    sed -i 's/UNDERSCOREUNDERSCOREUNDERSCORE/_/g' script.html
    rm script_escaped.fountain

"books/$LEVEL/$BOOK/content.json":
  description:
    The input fountain script has been modified to mark the beginning and end of frames along with their ids.
    Convert this modified fountain script into the JSON schema.
  schema_file: schemas/content.json-schema
  dependencies:
    common/about.md
    common/writing.md
    books/$LEVEL/themes.md
    books/$LEVEL/$BOOK/script.fountain.framed
    characters/$CHARACTER/about.json
    locations/$LOCATION/about.json
  variables:
    BOOK:
      # this command is like `ls books/$LEVEL` but it will only output directories;
      # this means that it will not find the `themes.md` file in `books/$LEVEL`;
      # the simpler ls command results in errors from treating that file like a directory
      find books/$LEVEL -maxdepth 1 -type d -not -path books/$LEVEL -printf "%f\n"

########################################
# artwork
########################################

"books/$LEVEL/$BOOK/frames/$FRAME_ID/art.png":
  description: |
    You are drawing the keyframe for an animation of the content below.
    <content>
    $(jq -c ".frames[] | select(.frame_id == \"$FRAME_ID\") | {action, objects, artist_notes, positioning, motivations, camera_static}" books/$LEVEL/$BOOK/content.json)
    </content>
    Important instructions:
    - The art should never include written text in any language.
    - The art should be full-bleed with no margin/padding/border/whitespace.
    - The art should use the attached files to guide the drawing.
    - There is one location reference frame that shows the background without characters. There is a corresponding about.json file for the location that describes the location.
    - For each character:
      - There is an about.json document that describes the character's appearance.
      - There is an attached sprite sheet.
      - The character should be drawn exactly once. Place the character "inside" the scene at an appropriate location and not just in the foreground.
      - Use the "height_in_meters" field to ensure that all characters are drawn with correct relative proportions.
    - For each object:
      - Place the object "inside" the scene at the specified location.
    $(
    if [ ! -z "$REFERENCE_FRAME" ]; then
    echo "- There is an attached reference_frame image.
      - The reference_frame is similar to the location image but also includes the characters from 5 seconds in the past.
      - When drawing, you should ensure that characters always have the exact same proportions relative to each other and the location as depicted in the reference_frame.
      - The characters should be placed in the same location as this reference_frame.
      - If there is a character in the reference_frame but there is no corresponding sprite sheet or about.json file, then this character has moved out of the scene and should not be drawn."
    fi
    )
    - You should adjust the camera angle and perspective (zoom in/out, roll, pan, dolly, etc) so that the view is focused on the action in the scene. You do not need to capture unnecessary background, and you do not need to use the same view as the location or reference frame (these are provided only as guides to ensure stylistic consistency, but not to ensure perspective consistency).
  options:
    #model: fal-ai/nano-banana/edit
    model: fal-ai/nano-banana-pro/edit
    aspect_ratio: '16:9'
  dependencies:
    - common/art.md
    - target: books/$LEVEL/$BOOK/content.json
      include: false
    - books/$LEVEL/$BOOK/frames/$REFERENCE_FRAME/art.png
    - locations/$MAYBE_LOCATION/about.json
    - locations/$MAYBE_LOCATION/reference.png
    - characters/$CHARACTER/about.json
    - characters/$CHARACTER/character_sheet.png
  variables:
    FRAME_ID:
      jq -r ".frames[].frame_id" books/$LEVEL/$BOOK/content.json
    CHARACTER:
      jq -r ".frames[] | select(.frame_id == \"$FRAME_ID\") | .characters[]" books/$LEVEL/$BOOK/content.json
    REFERENCE_FRAME:
      jq -r ".frames[] | select(.frame_id == \"$FRAME_ID\") | .reference_frame // empty" books/$LEVEL/$BOOK/content.json

    # NOTE:
    # This variable is different than the LOCATION variable because it will not be included if the REFERENC_FRAME variable is defined in the JSON.
    MAYBE_LOCATION: |
      if [ -z "$REFERENCE_FRAME" ]; then
        jq -r ".frames[] | select(.frame_id == \"$FRAME_ID\") | .locations[]" books/$LEVEL/$BOOK/content.json
      fi

########################################
# print book
########################################

"books/$LEVEL/$BOOK/frames/$FRAME_ID/page.pdf":
  cmd: |
    cp templates/page_template.tex books/$LEVEL/$BOOK/frames/$FRAME_ID/page.tex
    cd books/$LEVEL/$BOOK/frames/$FRAME_ID
    jq -r ".frames[] | select(.frame_id == \"$FRAME_ID\") | .speaker" ../../content.json > content.txt
    echo ": " >> content.txt
    jq -r ".frames[] | select(.frame_id == \"$FRAME_ID\") | .text" ../../content.json >> content.txt
    lualatex page.tex && lualatex page.tex
  dependencies:
    - templates/page_template.tex
    - books/$LEVEL/$BOOK/frames/$FRAME_ID/art.png

"books/$LEVEL/$BOOK/pages.pdf":
  cmd: |
    ordered_FRAME_IDs=$(jq -r .frames[].frame_id books/$LEVEL/$BOOK/content.json)
    pdfunite $(printf "books/$LEVEL/$BOOK/frames/%s/page.pdf " $ordered_FRAME_IDs) books/$LEVEL/$BOOK/pages.pdf
  dependencies:
    - books/$LEVEL/$BOOK/frames/$FRAME_ID/page.pdf
    - books/$LEVEL/$BOOK/content.json

####################
## redo the book with debugging info added
####################

"books/$LEVEL/$BOOK/frames/$FRAME_ID/page_debug.pdf":
  cmd: |
    cd books/$LEVEL/$BOOK/frames/$FRAME_ID

    # First we need to escape the variables we will use
    # so that they can be included safely in a latex document.
    escape_latex() {
        echo "$1" | sed 's/\\/\\textbackslash{}/g; s/{/\\{/g; s/}/\\}/g; s/\$/\\$/g; s/#/\\#/g; s/%/\\%/g; s/&/\\&/g; s/_/\\_/g; s/\^/\\textasciicircum{}/g; s/~/\\textasciitilde{}/g'
    }
    ESCAPED_FRAME_ID=$(escape_latex "$FRAME_ID")
    ESCAPED_REFERENCE_FRAME=$(escape_latex "$REFERENCE_FRAME")

    # Next we use latex to create an "overlay.pdf" file that contains the debug info.
    # Note that we must be VERY careful with escape characters to avoid syntax errors
    # (because this is latex inside of shell inside of yaml).
    cat > overlay.tex <<EOF
    \documentclass{article}
    \usepackage[paperheight=8.5in,paperwidth=11in,margin=0in]{geometry}
    \usepackage{tikz}
    \renewcommand{\familydefault}{\ttdefault}
    \begin{document}
    \begin{tikzpicture}[remember picture,overlay]
    \node[
        anchor=north east,
        fill=white,
        draw=black,
        line width=1mm,
        rounded corners=5mm,
        inner sep=3mm
    ] at (current page.north east) {
            \large
            \begin{tabular}{@{}rl@{}}
            FRAME\_ID: & $ESCAPED_FRAME_ID \\\\
            REFERENCE\_FRAME: & $ESCAPED_REFERENCE_FRAME \\\\
            \end{tabular}
    };
    \end{tikzpicture}
    \end{document}
    EOF
    pdflatex -interaction=nonstopmode overlay.tex
    pdflatex -interaction=nonstopmode overlay.tex

    # Generate the final result.
    pdftk page.pdf stamp overlay.pdf output page_debug.pdf
  dependencies:
    - books/$LEVEL/$BOOK/frames/$FRAME_ID/page.pdf
  variables:
    REFERENCE_FRAME:
      jq -r ".frames[] | select(.frame_id == \"$FRAME_ID\") | .reference_frame // empty" books/$LEVEL/$BOOK/content.json

"books/$LEVEL/$BOOK/pages_debug.pdf":
  cmd: |
    ordered_FRAME_IDs=$(jq -r .frames[].frame_id books/$LEVEL/$BOOK/content.json)
    pdfunite $(printf "books/$LEVEL/$BOOK/frames/%s/page_debug.pdf " $ordered_FRAME_IDs) books/$LEVEL/$BOOK/pages_debug.pdf
  dependencies:
    - books/$LEVEL/$BOOK/frames/$FRAME_ID/page_debug.pdf
    - books/$LEVEL/$BOOK/content.json

################################################################################
# video
################################################################################

"books/$LEVEL/$BOOK/frames/$FRAME_ID/animation_instructions.json":
  cmd: |
    # NOTE:
    # If we need to compress this to fit within a context window, use jq -c
    #jq ".frames[] | select(.frame_id == \"$FRAME_ID\") | {text, objects, locations, artist_notes, positioning}" books/$LEVEL/$BOOK/content.json > books/$LEVEL/$BOOK/frames/$FRAME_ID/animation_instructions.json
    jq ".frames[] |
    select(.frame_id == \"$FRAME_ID\") |
    {
        text,
        objects,
        locations,
        artist_notes,
        positioning,
        characters_that_enter: \"$ENTER_CHARACTER\" | split(\"\n\") | map(select(length > 0)),
        characters_that_exit: \"$EXIT_CHARACTER\" | split(\"\n\") | map(select(length > 0))
    }" \
    books/$LEVEL/$BOOK/content.json > books/$LEVEL/$BOOK/frames/$FRAME_ID/animation_instructions.json
  dependencies:
  - books/$LEVEL/$BOOK/content.json
  variables:
    CHARACTER:
      jq -r ".frames[] | select(.frame_id == \"$FRAME_ID\") | .characters[]" books/$LEVEL/$BOOK/content.json
    FRAME_ID:
      jq -r ".frames[].frame_id" books/$LEVEL/$BOOK/content.json
    REFERENCE_FRAME:
      jq -r ".frames[] | select(.frame_id == \"$FRAME_ID\") | .reference_frame // empty" books/$LEVEL/$BOOK/content.json
    # NOTE:
    # The complex grep commands below compute the difference between the characters in REFERENCE_FRAME and FRAME_ID.
    # This generates a list of new characters to add and old characters to remove from the scene.
    ENTER_CHARACTER: |
      if [ ! -z "$REFERENCE_FRAME" ]; then
        echo "$CHARACTER" | grep -v -F -x -f <(echo "$REFERENCE_CHARACTER") || true
      fi
    EXIT_CHARACTER: |
      if [ ! -z "$REFERENCE_FRAME" ]; then
        echo "$REFERENCE_CHARACTER" | grep -v -F -x -f <(echo "$CHARACTER") || true
      fi
    
    # This helper variable is only used in the calculation of ENTER_CHARACTER and EXIT_CHARACTER above.
    # It lists all the characters in the reference frame.
    REFERENCE_CHARACTER:
      jq -r ".frames[] | select(.frame_id == \"$REFERENCE_FRAME\") | .characters[]" books/$LEVEL/$BOOK/content.json

####################
# audio
####################

"books/$LEVEL/$BOOK/frames/$MAYBE_FRAME_ID/voice_instructions.txt":
  description:
    The following content describes a short 5 second animation.
    <content>
    $(jq -c ".frames[] | select(.frame_id == \"$MAYBE_FRAME_ID\")" books/$LEVEL/$BOOK/content.json)
    </content>
    Your job is to provide instructions for the voice actor who will be reading the "text" section for "$SPEAKER".
    The instructions should be 3-5 sentence and the provided generic description of the speaker's voice with emotions appropriate for what is going on in the included content.
    You should really emphasize and exagerate the emotional content. Although it is important to match the instructions to the style of the provided speaker, it is FAR MORE IMPORTANT to convey the appropriate emotions (love/fear/anger/etc).
  dependencies:
  - target: books/$LEVEL/$BOOK/content.json
    include: false
  - characters/$SPEAKER/voice.json
  variables:
    # NOTE:
    # This MAYBE_FRAME_ID is defined to exclude frames that have no text
    MAYBE_FRAME_ID: |
      jq -r ".frames[]  | select(.text | length > 1) | .frame_id" books/$LEVEL/$BOOK/content.json
    SPEAKER:
      jq -r ".frames[] | select(.frame_id == \"$MAYBE_FRAME_ID\") | .speaker" books/$LEVEL/$BOOK/content.json

"books/$LEVEL/$BOOK/frames/$MAYBE_FRAME_ID/page.wav":
  dependencies:
    #- books/$LEVEL/$BOOK/content.json
  - books/$LEVEL/$BOOK/frames/$MAYBE_FRAME_ID/voice_instructions.txt
  - characters/$SPEAKER/voice.json
  build_options:
  options:
    voice:
      $(jq -r ".voice_actor" characters/$SPEAKER/voice.json)
    input:
      $(jq -r ".frames[] | select(.frame_id == \"$MAYBE_FRAME_ID\") | .text" books/$LEVEL/$BOOK/content.json)
    instructions:
      $(cat books/$LEVEL/$BOOK/frames/$MAYBE_FRAME_ID/voice_instructions.txt)
  variables:
    # NOTE:
    # This MAYBE_FRAME_ID is defined to exclude frames that have no text
    MAYBE_FRAME_ID: |
      jq -r ".frames[]  | select(.text | length > 1) | .frame_id" books/$LEVEL/$BOOK/content.json
    SPEAKER:
      jq -r ".frames[] | select(.frame_id == \"$MAYBE_FRAME_ID\") | .speaker" books/$LEVEL/$BOOK/content.json

"books/$LEVEL/$BOOK/frames/$FRAME_ID/translation_$LANG.txt":
  description:
    Generate a literal translation into $LANG of the following text.
    Do not provide any explanation or any other output.
    <text>
    $(jq -r ".frames[] | select(.frame_id == \"$FRAME_ID\") | .text" books/$LEVEL/$BOOK/content.json)
    </text>
  dependencies:
    - target: books/$LEVEL/$BOOK/content.json
      include: false
  variables:
    FRAME_ID:
      jq -r ".frames[].frame_id" books/$LEVEL/$BOOK/content.json
    LANG: |
      echo "
      English
      Greek
      Hebrew
      Korean
      Latin
      Spanish
      "

"books/$LEVEL/$BOOK/frames/$FRAME_ID/audio_$LANG.wav":
  dependencies:
  - books/$LEVEL/$BOOK/frames/$FRAME_ID/translation_$LANG.txt
  options:
    voice: fable
    input:
      $(cat "books/$LEVEL/$BOOK/frames/$FRAME_ID/translation_$LANG.txt")
    instructions:
      Speak slowly with crystal-clear articulation, ensuring every syllable is distinct for young language learners to follow easily. Use a warm, gentle tone with slightly higher pitch than your natural register, matching the story's emotions—bright and animated for exciting scenes, soft for tender moments. Pause between sentences and naturally emphasize key vocabulary words, maintaining an encouraging, big-brother energy throughout the narration.

####################
# keyframes
####################

"books/$LEVEL/$BOOK/frames/$FRAME_ID/last_frame.png":
  cmd: |
    cd books/$LEVEL/$BOOK/frames/$FRAME_ID/

    # this strategy for computing the last frame is to reverse the movie and then extract the first frame
    # this seems to work better than than the commented method below,
    # but is also a bit slower than strictly necessary
    ffmpeg -i processed.mp4 -vf reverse -vframes 1 -q:v 1 -y last_frame.png

      # the strategy here for computing the last frame is to generate all the frames as files
      # and then select the last of those files;
      # this is relatively slow :(
      # unfortunately, other solutions get weird corruption artifacts or fail;
      # this is because the processed.mp4 file can have weird structures/codecs that break faster solutions;
      # since the videos are limited in size to <10seconds,
      # this procedure will never consume all that much disk space/time,
      # even if it is inelegant
      #ffmpeg -i processed.mp4 -q:v 1 temp_frame_%05d.png
      #LAST_FRAME=$(ls temp_frame_*.png | sort -V | tail -n 1)
      #cp "$LAST_FRAME" last_frame.png
      #rm temp_frame_*.png  # clean up others
  dependencies:
    - books/$LEVEL/$BOOK/frames/$FRAME_ID/processed.mp4

"books/$LEVEL/$BOOK/frames/$FRAME_ID/character_transition.png":
  description: |
    Attached is a keyframe for the start of a 5 second animation. Your job is to create a final keyframe for what the scene looks like at the end of the 5 seconds. The files books/$LEVEL/$BOOK/frames/$FRAME_ID/animation_instructions.* describe what happens in the scene.
    $(
    if [ ! -z "$ENTER_CHARACTER" ]; then
    echo "You must add the following characters to the scene: ${ENTER_CHARACTER}. Character sheets and descriptions are attached."
    fi
    if [ ! -z "$EXIT_CHARACTER" ]; then
    echo "You must remove the following characters from the scene: ${EXIT_CHARACTER}. Character descriptions are attached."
    fi
    )
    The art should never include written text in any language.
    The art should be full-bleed with no margin/padding/border/whitespace.
    The art should use the attached files to guide the drawing.
    $(
    echo "- There is one location reference frame that shows the background without characters. There is a corresponding about.json file for the location that describes the location."
    )
    - For each character:
      - There is an about.json document that describes the character's appearance.
      - There is an attached sprite sheet.
      - The character should be drawn exactly once. Place the character "inside" the scene at an appropriate location and not just in the foreground.
    $(
    if [ ! -z "$REFERENCE_FRAME" ]; then
    echo "- There is an attached reference_frame image.
      - The reference_frame is similar to the location image but also includes the characters from 5 seconds in the past.
      - When drawing, you should ensure that characters always have the exact same proportions relative to each other and the location as depicted in the reference_frame.
      - The characters should be placed in the same location as this reference_frame.
      - If there is a character in the reference_frame but there is no corresponding sprite sheet or about.json file, then this character has moved out of the scene and should not be drawn."
    fi
    )
  options:
    model: fal-ai/nano-banana-pro/edit
    aspect_ratio: '16:9'
  dependencies:
    - books/$LEVEL/$BOOK/frames/$FRAME_ID/animation_instructions.json
    - books/$LEVEL/$BOOK/frames/$FRAME_ID/animation_instructions.txt
    - books/$LEVEL/$BOOK/frames/$REFERENCE_FRAME/last_frame.png
    - characters/$CHARACTER/about.json
    - characters/$CHARACTER/character_sheet.png
    - characters/$ENTER_CHARACTER/character_sheet.png
    - characters/$EXIT_CHARACTER/about.json
    - locations/$LOCATION/reference.png
    - locations/$LOCATION/about.json
  variables:
    CHARACTER:
      jq -r ".frames[] | select(.frame_id == \"$FRAME_ID\") | .characters[]" books/$LEVEL/$BOOK/content.json
    REFERENCE_FRAME:
      jq -r ".frames[] | select(.frame_id == \"$FRAME_ID\") | .reference_frame // empty" books/$LEVEL/$BOOK/content.json
    ENTER_CHARACTER:
      jq -r ".characters_that_enter[] // empty" books/$LEVEL/$BOOK/frames/$FRAME_ID/animation_instructions.json
    EXIT_CHARACTER:
      jq -r ".characters_that_exit[] // empty" books/$LEVEL/$BOOK/frames/$FRAME_ID/animation_instructions.json

    LOCATION: |
      jq -r ".frames[] | select(.frame_id == \"$FRAME_ID\") | .locations[]" books/$LEVEL/$BOOK/content.json

"books/$LEVEL/$BOOK/frames/$FRAME_ID/warmstart.png":
  description:
    The attached image is a keyframe for an animation;
    the image shows the result of the action described below.
    <content>
    $(jq -c ".frames[] | select(.frame_id == \"$FRAME_ID\") | {text, objects, locations, artist_notes, positioning}" books/$LEVEL/$BOOK/content.json)
    </content>
    Your job is to "undo" the action and create what the scene looked like about 5 seconds ago before the action happened.
  options:
    model: fal-ai/nano-banana/edit
    aspect_ratio: '16:9'
  dependencies:
    - books/$LEVEL/$BOOK/frames/$FRAME_ID/art.png
  variables:
    FRAME_ID:
      jq -r ".frames[].frame_id" books/$LEVEL/$BOOK/content.json
    CHARACTER:
      jq -r ".frames[] | select(.frame_id == \"$FRAME_ID\") | .characters[]" books/$LEVEL/$BOOK/content.json

####################
# video generation
####################

"books/$LEVEL/$BOOK/frames/$FRAME_ID/animation_instructions.txt":
  description:
    You are animating a short 4 second scene described by the file "books/$LEVEL/$BOOK/frames/$FRAME_ID/animation_instructions.json".
    The start/stop frames of the scene have already been drawn and is provided in the attached images.
    You must provide a 3-5 sentence description of how to animate the provided input image.
    Use simple language that is easy to follow, and always describe the events in chronological order.
    The description should explicitly describe what each character is doing (e.g. running, sitting, writing) and their emotions (e.g. angry, happy, sad).
    If a character enters/exits the scene, you should explicitly state how they do that (e.g. exists stage left, enters through the door, camera pans to show the character). Whenever possible prefer "natural" exits/entrances through something in the location (e.g. enter through a doors, or from behind a house/bush, or even through a window if humor is called for); revealing the characer through camera movement is also good; it is acceptable to exit stage left/right if there are no natural entrances/exits.
    All descriptions must perfectly match the images.
    You should explicitly describe the camera angle and perspective (zoom in/out, roll, pan, dolly, etc) so that the view is focused on the action in the scene; you do not need to capture unnecessary background. You cannot use cuts, only smooth camera movements.
    Your instructions must explicitly state that all listed characters must stay in the shot (at least from the knees up) and they must not occlude one another.
    You must also explicitly state that no objects should move unless absolutely necessary.
    If there are two locations in the "locations" field, you must describe a way of moving the camera/action so that the scene smoothly transitions between the locations; you cannot cut or fade between the locations. (It is okay to add 1-2 additional sentences to explain how to do this since it is more complicated.)
  dependencies:
    - books/$LEVEL/$BOOK/frames/$MAYBE_FRAME/art.png
    - books/$LEVEL/$BOOK/frames/$REFERENCE_FRAME/last_frame.png
    - books/$LEVEL/$BOOK/frames/$FRAME_ID/animation_instructions.json
    - characters/$CHARACTER/about.json
  variables:
    REFERENCE_FRAME:
      jq -r ".frames[] | select(.frame_id == \"$FRAME_ID\") | .reference_frame // empty" books/$LEVEL/$BOOK/content.json
    MAYBE_FRAME: |
      if [ -z "$REFERENCE_FRAME" ]; then
        echo "$FRAME_ID"
      fi
    CHARACTER:
      jq -r ".frames[] | select(.frame_id == \"$FRAME_ID\") | .characters[]" books/$LEVEL/$BOOK/content.json

"books/$LEVEL/$BOOK/frames/$FRAME_ID/video.mp4":
  dependencies:
    - books/$LEVEL/$BOOK/frames/$MAYBE_FRAME/art.png
    - books/$LEVEL/$BOOK/frames/$REFERENCE_TRANSITION/character_transition.png
    - books/$LEVEL/$BOOK/frames/$REFERENCE_FRAME/last_frame.png
    - target: books/$LEVEL/$BOOK/frames/$MAYBE_FRAME_ID/page.wav
      include: false
    - target: books/$LEVEL/$BOOK/frames/$FRAME_ID/animation_instructions.txt
      is_prompt: true
  options: |
    $(
    # The REFERENCE_TRANSITION variable will be defined
    # whenever the REFERENCE_FRAME is defined and the characters have changed
    # between REFERENCE_FRAME and FRAME_ID.
    # This is the only situation where we use a video model with a start and end frame.
    if [ ! -z $REFERENCE_TRANSITION ]; then
    START_IMAGE=books/$LEVEL/$BOOK/frames/$REFERENCE_FRAME/last_frame.png
    END_IMAGE=books/$LEVEL/$BOOK/frames/$FRAME_ID/character_transition.png
    echo "
    model: fal-ai/kling-video/o1/image-to-video
    first_frame: $START_IMAGE
    last_frame: $END_IMAGE
    duration: 5
    "
    #model: fal-ai/veo3.1/first-last-frame-to-video
    #model: fal-ai/veo3.1/fast/first-last-frame-to-video
    #echo "
    #model: fal-ai/veo3.1/first-last-frame-to-video
    #first_frame: $START_IMAGE
    #last_frame: $END_IMAGE
    #duration: 8
    #generate_audio: false
    #resolution: 1080p
    #"

    # Use the cheaper start-frame only to video.
    else

    # compute duration;
    # if the frame text is long, we want the video to be generated long,
    # but if the frame text is short, we want the video to be short
    # the page.wav file may not exist if there is no text for the frame,
    # in which case the duration is set to the smallest possible
    if [ -f "books/$LEVEL/$BOOK/frames/$FRAME_ID/page.wav" ]; then
    AUDIO_DURATION=$(ffprobe -v quiet -show_entries format=duration -of csv=p=0 books/$LEVEL/$BOOK/frames/$FRAME_ID/page.wav)
    else
    AUDIO_DURATION=0
    fi
    if [ "${AUDIO_DURATION%.*}" -gt 5 ]; then
      DURATION=10
    else
      DURATION=5
    fi

    # compute start frame
    if [ -z "$REFERENCE_FRAME" ]; then
      START_IMAGE=books/$LEVEL/$BOOK/frames/$FRAME_ID/art.png
    else
      START_IMAGE=books/$LEVEL/$BOOK/frames/$REFERENCE_FRAME/last_frame.png
    fi

    # print options
    echo "
    model: fal-ai/kling-video/v2.5-turbo/standard/image-to-video
    first_frame: $START_IMAGE
    duration: $DURATION
    "
    fi
    )
  variables:
    REFERENCE_FRAME:
      jq -r ".frames[] | select(.frame_id == \"$FRAME_ID\") | .reference_frame // empty" books/$LEVEL/$BOOK/content.json
    CHARACTER:
      jq -r ".frames[] | select(.frame_id == \"$FRAME_ID\") | .characters[]" books/$LEVEL/$BOOK/content.json

    # NOTE:
    # This MAYBE_FRAME_ID will return the FRAME_ID only if there is text (and so audio should be generated)
    MAYBE_FRAME_ID: |
      jq -r ".frames[] | select(.frame_id == \"$FRAME_ID\") | select(.text | length > 1) | .frame_id" books/$LEVEL/$BOOK/content.json

    # NOTE:
    # The REFERENCE_TRANSITION variable will only be defined when the characters have changed between the REFERENCE_FRAME and FRAME_ID.
    REFERENCE_CHARACTER:
      jq -r ".frames[] | select(.frame_id == \"$REFERENCE_FRAME\") | .characters[]" books/$LEVEL/$BOOK/content.json
    ADD_CHARACTER: |
      echo "$CHARACTER" | grep -v -F -x -f <(echo "$REFERENCE_CHARACTER") || true
    RM_CHARACTER: |
      echo "$REFERENCE_CHARACTER" | grep -v -F -x -f <(echo "$CHARACTER") || true
    REFERENCE_TRANSITION: |
      if [[ ! -z "$REFERENCE_FRAME" && ! -z "$ADD_CHARACTER" ]]; then
        echo "$FRAME_ID"
      fi
    MAYBE_FRAME: |
      if [ -z "$REFERENCE_FRAME" ]; then
        echo "$FRAME_ID"
      fi

"books/$LEVEL/$BOOK/frames/$FRAME_ID/video_old.mp4":
  dependencies:
    - books/$LEVEL/$BOOK/frames/$FRAME_ID/art_1280x720.png
      #- books/$LEVEL/$BOOK/frames/$FRAME_ID/art_1920x1080.png
    - target: books/$LEVEL/$BOOK/frames/$FRAME_ID/animation_instructions.txt
      is_prompt: true
      #- books/$LEVEL/$BOOK/frames/$REFERENCE_FRAME/art_1280x720.png
    - books/$LEVEL/$BOOK/frames/$REFERENCE_FRAME/last_frame.png
      #- books/$LEVEL/$BOOK/frames/$REFERENCE_FRAME/last_frame_1920x1080.png
      #- characters/$CHARACTER/character_sheet.png
  options: |
    $(
    if [ -z "$REFERENCE_FRAME" ]; then
    #if true; then
    #echo "
    #model: openai/sora-2
    #size: 1280x720
    #seconds: 4
    #"
    echo "
    model: fal-ai/kling-video/v2.5-turbo/standard/image-to-video
    first_frame: books/$LEVEL/$BOOK/frames/$FRAME_ID/art_1280x720.png
    duration: 5
    "
    else
    #echo "
    #model: fal-ai/kling-video/o1/reference-to-video
    #seconds: 5
    #start_frame: books/$LEVEL/$BOOK/frames/$REFERENCE_FRAME/last_frame_1920x1080.png
    #"
    #model: fal-ai/veo3.1/fast/first-last-frame-to-video
    echo "
    model: fal-ai/kling-video/o1/image-to-video
    first_frame: books/$LEVEL/$BOOK/frames/$REFERENCE_FRAME/last_frame.png
    last_frame: books/$LEVEL/$BOOK/frames/$FRAME_ID/art_1280x720.png
    "
    fi
    )
  variables:
    REFERENCE_FRAME:
      jq -r ".frames[] | select(.frame_id == \"$FRAME_ID\") | .reference_frame // empty" books/$LEVEL/$BOOK/content.json
    CHARACTER:
      jq -r ".frames[] | select(.frame_id == \"$FRAME_ID\") | .characters[]" books/$LEVEL/$BOOK/content.json

####################
# video post-processing
####################

"books/$LEVEL/$BOOK/frames/$FRAME_ID/processed.mp4":
  cmd: |
    cd books/$LEVEL/$BOOK/frames/$FRAME_ID

    # if page.wav doesn't exist, create an empty file 1 second long
    if [ ! -f page.wav ]; then
      ffmpeg -f lavfi -i anullsrc=channel_layout=stereo:sample_rate=44100 -t 1 empty.wav
    fi

    # Get durations
    VIDEO_DURATION=$(ffprobe -v quiet -show_entries format=duration -of csv=p=0 video.mp4)
    AUDIO_DURATION=$(ffprobe -v quiet -show_entries format=duration -of csv=p=0 page.wav)

    # Calculate target video duration with padding (specified in seconds)
    START_PAD=0.2
    END_PAD=1
    TARGET_DURATION=$(echo "scale=6; $AUDIO_DURATION + $START_PAD + $END_PAD" | bc -l)

    # Compare target duration with original video duration
    if (( $(echo "$TARGET_DURATION > $VIDEO_DURATION" | bc -l) )); then
        # Need to slow down video to match target duration
        SLOWDOWN_FACTOR=$(echo "scale=6; $VIDEO_DURATION / $TARGET_DURATION" | bc -l)
        ffmpeg -i video.mp4 -i page.wav -filter:v "setpts=PTS/$SLOWDOWN_FACTOR" -c:a aac -af "adelay=${START_PAD}s,apad=pad_dur=${END_PAD}" -map 0:v:0 -map 1:a:0 -t $TARGET_DURATION processed-tmp.mp4 -y
    else
        # Video is long enough - pad audio and trim/pad video as needed
        ffmpeg -i video.mp4 -i page.wav -c:v copy -c:a aac -af "adelay=$START_PAD"s,apad -map 0:v:0 -map 1:a:0 -t $TARGET_DURATION processed-tmp.mp4 -y
    fi

    # Process additional audio files to match page.wav duration
    for audio_file in audio_*.wav; do
        echo ">> $audio_file"
        # Skip if it's a processed file
        if [[ "$audio_file" == *"_processed.wav" ]]; then
            continue
        fi
        if [ -f "$audio_file" ]; then
            LANG=$(echo "$audio_file" | sed 's/audio_\(.*\)\.wav/\1/')
            CURR_DURATION=$(ffprobe -v quiet -show_entries format=duration -of csv=p=0 "$audio_file")

            if (( $(echo "$CURR_DURATION > $AUDIO_DURATION" | bc -l) )); then
                # Speed up audio to match target duration
                SPEED_FACTOR=$(echo "scale=6; $CURR_DURATION / $AUDIO_DURATION" | bc -l)
                ffmpeg -i "$audio_file" -af "atempo=$SPEED_FACTOR" "audio_${LANG}_processed.wav" -y
            else
                # Audio is shorter or equal, just copy and pad
                ffmpeg -i "$audio_file" -af "apad=pad_dur=$AUDIO_DURATION" "audio_${LANG}_processed.wav" -y
            fi
        fi
    done

    # Convert text files to SRT format before processing
    for txt_file in translation_*.txt; do
        if [ -f "$txt_file" ]; then
            LANG=$(echo "$txt_file" | sed 's/translation_\(.*\)\.txt/\1/')
            srt_file="translation_${LANG}.srt"

            # Convert text to SRT format - assumes the entire text should be shown for the full duration
            echo "1" > "$srt_file"
            echo "00:00:00,200 --> 00:00:$(printf "%02d" $(echo "$AUDIO_DURATION" | cut -d. -f1)),$(echo "scale=0; ($AUDIO_DURATION - $(echo "$AUDIO_DURATION" | cut -d. -f1)) * 1000" | bc | cut -d. -f1)" >> "$srt_file"
            cat "$txt_file" >> "$srt_file"
            echo "" >> "$srt_file"
        fi
    done

    # Execute final conversion
    FFMPEG_CMD="ffmpeg -i processed-tmp.mp4"
    MAP_OPTS="-map 0:v:0 -map 0:a:0"
    METADATA=""
    input_index=1
    audio_track_index=1
    subtitle_track_index=0

    for audio_file in audio_*_processed.wav; do
        if [ -f "$audio_file" ]; then
            LANG=$(echo "$audio_file" | sed 's/audio_\(.*\)_processed\.wav/\1/')
            FFMPEG_CMD="$FFMPEG_CMD -i $audio_file"
            MAP_OPTS="$MAP_OPTS -map $input_index:a:0"
            METADATA="$METADATA -metadata:s:a:$audio_track_index language=$LANG -metadata:s:a:$audio_track_index title=$LANG"

            input_index=$((input_index + 1))
            audio_track_index=$((audio_track_index + 1))

            # Add subtitle if it exists
            if [ -f "translation_${LANG}.srt" ]; then
                FFMPEG_CMD="$FFMPEG_CMD -i translation_${LANG}.srt"
                MAP_OPTS="$MAP_OPTS -map $input_index:s:0"
                METADATA="$METADATA -metadata:s:s:$subtitle_track_index language=$LANG -metadata:s:s:$subtitle_track_index title=$LANG"
                input_index=$((input_index + 1))
                subtitle_track_index=$((subtitle_track_index + 1))
            fi
        fi
    done

    $FFMPEG_CMD $MAP_OPTS -r 30 -s 1280x720 -c:v libx264 -pix_fmt yuv420p -c:a aac -c:s mov_text -ar 48000 -ac 2 -vsync cfr $METADATA processed.mp4 -y

    # We do a final re-encoding step to ensure that all of the files have the exact same parameters
    rm processed-tmp.mp4
    rm audio_*_processed.wav || true # we shouldn't fail the script if the files don't exist
  dependencies:
    - books/$LEVEL/$BOOK/frames/$FRAME_ID/video.mp4
      #- books/$LEVEL/$BOOK/frames/$FRAME_ID/page.wav
      #- books/$LEVEL/$BOOK/frames/$FRAME_ID/audio_$LANG.wav

"books/$LEVEL/$BOOK/video.mp4":
  cmd: |
    cd books/$LEVEL/$BOOK
    printf "file 'frames/%s/processed.mp4'\n" $FRAME_ID > video_list.txt

    # the following command concats the processed.mp4 files without re-encoding;
    # this is very fast but requires all of the processed.mp4 files to have same encoding parameters
    # the code for processed.mp4 should be written in a way to guarantee this
    ffmpeg -f concat -safe 0 -i video_list.txt -c copy "video.mp4" -y

    # the following command re-encodes all of the video;
    # it is much slower, but could be useful for debugging if the processed.mp4 files cannot be directly copied
    #ffmpeg -f concat -safe 0 -i video_list.txt -c:v libx264 -c:a aac "video.mp4" -y
  dependencies:
    - books/$LEVEL/$BOOK/frames/$FRAME_ID/processed.mp4
  variables:
    FRAME_ID:
      jq -r ".frames[].frame_id" books/$LEVEL/$BOOK/content.json

"videos/$LEVEL-$BOOK.mp4":
  cmd: ln -s "../books/$LEVEL/$BOOK/video.mp4" "videos/$LEVEL-$BOOK.mp4"
  dependencies:
    - books/$LEVEL/$BOOK/video.mp4
