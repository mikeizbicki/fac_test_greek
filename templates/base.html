<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Framed Fountain Viewer{% endblock %}</title>
    <style>
        /* Reset */
        html,body,div,span,object,iframe,h2,h3,h4,h5,h6,p,blockquote,pre,abbr,address,cite,code,del,dfn,em,img,ins,kbd,q,samp,small,strong,sub,sup,var,b,i,dl,dt,dd,ol,ul,li,fieldset,form,label,legend,table,caption,tbody,tfoot,thead,tr,th,td,article,aside,canvas,details,figcaption,figure,footer,header,hgroup,menu,nav,section,summary,time,mark,audio,video {
        margin: 0;
        padding: 0;
        border: 0;
        font-size: 100%;
        font: inherit;
        vertical-align: baseline;
        }
        article,aside,details,figcaption,figure,footer,header,hgroup,menu,nav,section {
        display: block;
        }

        body {
            font-family: 'Courier New', monospace;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            line-height: 1.6;
        }
        .frame {
            border-top: 1px dotted #ccc;
            padding: 0px 15px 15px 15px;
            /*
            margin: 20px 0;
            border-radius: 5px;
            background-color: #f9f9f9;
            margin-right: 100px;
            */
            position: relative;
        }
        .frame-header {
            font-weight: bold;
            color: #666;
            font-size: 0.9em;
            position: absolute;
            right: -625px; /* Position outside the frame */
            top: 0;
            width: 600px;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            -khtml-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            -o-user-select: none;
            user-select: none;
        }
        .frame-image {
            width: 150px;
            height: auto;
            border: 1px solid #ddd;
            margin: 5px 0;
        }

        .audio-button {
            background-color: #2196F3;
            color: white;
            border: none;
            padding: 3px 8px;
            cursor: pointer;
            font-size: 0.8em;
            margin: 2px 0;
        }

        .audio-button:hover {
            background-color: #1976D2;
        }
        .book-list {
            list-style-type: none;
            padding: 0;
        }
        .book-list li {
            margin: 10px 0;
            padding: 10px;
            background-color: #f0f0f0;
            border-radius: 3px;
        }
        .book-list a {
            text-decoration: none;
            color: #333;
        }
        .book-list a:hover {
            color: #666;
        }
        .error {
            color: red;
            font-style: italic;
        }
        .nav {
            margin-bottom: 30px;
        }
        .nav a {
            color: #666;
            text-decoration: none;
        }
        .nav a:hover {
            text-decoration: underline;
        }

/* Styles for Screenplain */
#wrapper {
font-family: 'Courier Final Draft','Courier Screenplay',Courier;
font-size: 12pt;
text-align: left;
width: 480pt;
padding-left: 90pt;
padding-top: 24pt;
position: relative;
margin: 0 auto;
}
header {
margin-bottom: 1em;
border-bottom: 1px solid black;
}
footer {
margin-top: 1em;
}
em {
font-style: italic;
}
strong {
font-weight: bold;
}
br {
clear: both;
}

/* Slug */

div {
width: 460pt;
}
/*
h1:before,h2:before,h3:before,h4:before,h5:before {
content: "\25e6\00a0";
margin-left:-9pt;
}
h1,h2,h3,h4,h5{
font-family:'Gill Sans','Helvetiva Neue',Helvetica,sans-serif;
margin-top:24pt;
font-weight:400;
color: rgb(110, 110, 110);
border-top:dotted 1px rgb(199, 199, 199);
background-image: -webkit-linear-gradient(top, rgb(255, 255, 245), rgb(255, 255, 255));
font-size: 11pt;
}
h1,.h1-synopsis {
margin-left:-71pt;

margin-left:-61pt;
}
h3,.h3-synopsis {
margin-left:-41pt;
}
h4,.h4-synopsis {
margin-left:-21pt;
}
h5,.h5-synopsis {
margin-left:-1pt;

*/
.h1-synopsis,.h2-synopsis,.h3-synopsis,.h4-synopsis,.h5-synopsis,.h6-synopsis{
font-family:'Gill Sans','Helvetiva Neue',Helvetica,sans-serif;
font-size: 10pt;
font-style: italic;
color:rgb(145, 145, 145);
display:block;
margin-bottom:5pt;
}
h6 {
/*margin-top: 2em;*/
text-transform: uppercase;
font-weight: bold;
}
div.block {
position: relative;
background: #fff;
}
div.action p {
margin-top: 1em;
}
.centered {
text-align: center;
}
div.dialog,div.dual {
margin-top: 1em;
}
div.transition {
margin-top: 1em;
margin-bottom: 12pt;
text-align: right;
}
.dialog p.character {
padding-left: 153.33pt;
}
.dialog p.parenthetical {
padding-left: 115pt;
}
.dialog p {
padding-left: 76.67pt;
width: 306.67pt;
}
.dual > div {
float: left;
width: 48%!important;
}
.dual p.character {
padding-left: 6em;
}
.dual p.parenthetical {
padding-left: 3em;
}
.dual p {
padding-left: 0;
width: 19em;
}
.dual .right {
margin-left: 1em;
}
.dual .right p.character {
padding-left: 6em;
}
span.scnuml {
display: block;
float: left;
margin-left: -4.52em;
font-weight: inherit;
-webkit-touch-callout: none;
-webkit-user-select: none;
-khtml-user-select: none;
-moz-user-select: none;
-ms-user-select: none;
-o-user-select: none;
user-select: none;
}
span.scnumr {
display: block;
float: right;
margin-right: 0.72em;
font-weight: inherit;
-webkit-touch-callout: none;
-webkit-user-select: none;
-khtml-user-select: none;
-moz-user-select: none;
-ms-user-select: none;
-o-user-select: none;
user-select: none;
}
.page-break {
page-break-before: always;
}

/* text editing */
.frame-textarea {
    width: 100%;
    min-height: 200px;
    font-family: 'Courier New', monospace;
    font-size: 12pt;
    border: 1px solid #ccc;
    padding: 0px;
    resize: vertical;
}

.run-button, .cancel-button {
    margin: 10px 5px 0 0;
    padding: 5px 10px;
    cursor: pointer;
}

.run-button {
    background-color: #4CAF50;
    color: white;
    border: none;
    margin-bottom: 1em;
}

.cancel-button {
    background-color: #f44336;
    color: white;
    border: none;
}

.frame-content {
}

.edit-tabs {
    display: flex;
    margin-bottom: 10px;
}

.tab-button {
    padding: 8px 16px;
    border: 1px solid #ccc;
    background: #f0f0f0;
    cursor: pointer;
    border-bottom: none;
}

.tab-button.active {
    background: white;
    border-bottom: 1px solid white;
    margin-bottom: -1px;
}

.tab-content {
    border: 1px solid #ccc;
    padding: 0;
}

.frame-json-textarea {
    width: 100%;
    min-height: 200px;
    font-family: 'Courier New', monospace;
    font-size: 11pt;
    border: none;
    padding: 10px;
    resize: vertical;
}

/* frame editing controls */
.frame-controls {
    position: absolute;
    bottom: 10px;
    right: 10px;
    display: none;
    background: rgba(255, 255, 255, 0.9);
    padding: 5px;
    border-radius: 3px;
    border: 1px solid #ddd;
}

.frame:hover .frame-controls {
    display: block;
}

/* Hide controls when frame is in edit mode */
.frame-edit:not([style*="display: none"]) ~ .frame-controls,
.frame .frame-edit[style*="display: block"] ~ .frame-controls {
    display: none !important;
}

.control-btn {
    background: none;
    border: none;
    font-size: 16px;
    cursor: pointer;
    margin: 0 2px;
    padding: 2px 4px;
    border-radius: 2px;
}

.control-btn:hover {
    background: #f0f0f0;
}
    </style>
</head>
<body>
    <div class="nav">
        <a href="/">← Back to Books</a>
    </div>
    
    {% block content %}{% endblock %}
</body>
</html>
